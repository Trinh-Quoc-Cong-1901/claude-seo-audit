<title>SEO Audit Tài Chính Thăng Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#1e3a5f; --gold:#b8860b; --pass:#2d6a4f; --warn:#d4740e; --fail:#c53030;
  --bg:#faf9f7; --surface:#ffffff; --ink:#1c2430; --muted:#5a6473; --line:#e4e1da; --tint:#eef2f7;
  --navy-ink:#1e3a5f; --bar-bg:#ece9e3;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11161d; --surface:#18202a; --ink:#e6e9ee; --muted:#9aa5b4; --line:#2a3542; --tint:#1c2733;
    --navy-ink:#9dbbe0; --gold:#d9a93a; --pass:#5fb58c; --warn:#f0954a; --fail:#f07171; --bar-bg:#26303c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11161d; --surface:#18202a; --ink:#e6e9ee; --muted:#9aa5b4; --line:#2a3542; --tint:#1c2733;
  --navy-ink:#9dbbe0; --gold:#d9a93a; --pass:#5fb58c; --warn:#f0954a; --fail:#f07171; --bar-bg:#26303c;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding-inline:20px;padding-block:0 64px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:0}.toc{display:none}}
header.cover{max-width:1120px;margin:0 auto;padding-block:48px 32px;border-bottom:2px solid var(--navy-ink);margin-bottom:32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
@media (max-width:700px){header.cover{grid-template-columns:1fr}}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--serif);font-size:clamp(32px,5vw,48px);line-height:1.1;color:var(--navy-ink);margin:8px 0 12px;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 20px}
.meta b{color:var(--ink);font-weight:600}
.score{display:grid;justify-items:center;gap:4px}
.score .num{font-family:var(--serif);font-size:72px;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
.score .of{font-size:13px;color:var(--muted)}
.score .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;font-size:14px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 0 5px 12px;border-left:2px solid var(--line)}
.toc a:hover,.toc a:focus-visible{color:var(--navy-ink);border-left-color:var(--gold);outline:none}
main{min-width:0}
section{padding-block:8px 32px;border-bottom:1px solid var(--line);margin-bottom:32px}
section:last-child{border-bottom:0}
h2{font-family:var(--serif);font-size:28px;color:var(--navy-ink);margin:0 0 6px;text-wrap:balance}
h2 .sc{font-family:var(--sans);font-size:15px;font-weight:600;padding:2px 10px;border-radius:4px;margin-left:10px;vertical-align:middle;white-space:nowrap}
h3{font-size:17px;margin:28px 0 8px;color:var(--ink)}
p{margin:0 0 14px;max-width:72ch}
.lede{color:var(--muted);max-width:72ch;margin-bottom:20px}
code,.mono{font-family:var(--mono);font-size:.86em;background:var(--tint);padding:1px 5px;border-radius:3px;word-break:break-word}
a{color:var(--navy-ink)}
.bars{display:grid;gap:10px;margin:8px 0 24px}
.bar{display:grid;grid-template-columns:190px minmax(0,1fr) 44px 48px;gap:12px;align-items:center;font-size:14px}
@media (max-width:560px){.bar{grid-template-columns:120px minmax(0,1fr) 36px;}.bar .w{display:none}}
.track{height:12px;background:var(--bar-bg);border-radius:2px;position:relative;overflow:hidden}
.fill{height:100%;border-radius:2px}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bar .w{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.ok{background:color-mix(in srgb,var(--pass) 16%,transparent);color:var(--pass)}
.md{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bd{background:color-mix(in srgb,var(--fail) 14%,transparent);color:var(--fail)}
.f-ok{background:var(--pass)}.f-md{background:var(--warn)}.f-bd{background:var(--fail)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 24px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:28px;color:var(--navy-ink);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .t{font-size:13px;color:var(--muted)}
.finding{border-left:4px solid var(--line);background:var(--surface);padding:14px 18px;margin:0 0 12px}
.finding.c{border-left-color:var(--fail)}.finding.h{border-left-color:var(--warn)}.finding.m{border-left-color:var(--gold)}.finding.l{border-left-color:var(--muted)}
.finding .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:6px}
.finding .hd strong{font-size:16px}
.sev{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:1px 8px;border-radius:3px}
.sev.c{background:color-mix(in srgb,var(--fail) 14%,transparent);color:var(--fail)}
.sev.h{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.sev.m{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.sev.l{background:var(--tint);color:var(--muted)}
.finding p{margin:0 0 6px;font-size:15px}
.finding .fix{font-size:15px}
.finding .fix::before{content:"Cách sửa: ";font-weight:600;color:var(--pass)}
.works{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:4px;font-size:15px}
.works li::before{content:"✓";color:var(--pass);font-weight:700;margin-right:8px}
.tbl{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--tint)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
@media (max-width:600px){.phase{grid-template-columns:1fr;gap:4px}}
.phase h4{margin:0;font-size:15px;color:var(--navy-ink)}
.phase .when{font-size:13px;color:var(--gold);font-weight:600}
.phase ol{margin:0;padding-left:20px;font-size:15px;display:grid;gap:4px}
.note{background:var(--tint);padding:12px 16px;font-size:14px;color:var(--muted);margin:0 0 16px;max-width:none}
pre{background:var(--tint);padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;border:1px solid var(--line)}
footer{max-width:1120px;margin:0 auto;color:var(--muted);font-size:13px;padding-top:16px}
@media (prefers-reduced-motion:no-preference){.fill{animation:grow .8s ease-out both}@keyframes grow{from{transform:scaleX(.2);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}}
</style>
